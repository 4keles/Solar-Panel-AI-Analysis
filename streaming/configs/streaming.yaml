model:
  path: ""                    # Boş bırakılırsa ../models/latest/best.pt denenir
  modality: "rgb"             # "rgb" veya "thermal"
  conf: 0.25
  iou: 0.45
  device: "0"                 # "cpu" | "0" | "cuda:0"
  thermal_mode: null          # null | "grayscale" | "inferno" | "jet" | "magma" | "hot"
  auto_detect_thermal: true

source:
  type: "camera"              # "camera" | "video" | "ip" | "rtsp" | "rtmp"
  camera_id: 0
  video_path: ""
  ip_url: ""
  rtsp_url: ""
  rtmp_url: ""
  reconnect:
    enabled: true
    max_retries: 10
    retry_interval_sec: 3.0

recording:
  enabled: false
  output_dir: "output/recordings" # Geriye dönük uyumluluk için
  video_output_dir: "output/recordings"
  capture_output_dir: "data/raw_data/captured"
  codec: "mp4v"
  fps_override: null          # null ise kaynaktan alınır

display:
  show_window: true
  window_title: "Solar Panel OD - Streaming"
  scale: 1.0
  show_fps: true
  show_conf: true
  show_class_label: true

