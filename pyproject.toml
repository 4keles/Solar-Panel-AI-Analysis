[project]
name = "solar-panel-od"
version = "1.2.1"
description = "YOLO11-based multi-modal (RGB + thermal) solar panel defect detection — 6-class anomaly classification"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "4keles", email = "vibemetriconline@gmail.com" }]

dependencies = [
    "albumentations>=2.0.8",
    "opencv-python>=4.13.0.92",
    "reportlab>=4.4.10",
    "structlog>=25.5.0",
    "ultralytics>=8.3.0",
    "onnxruntime-gpu>=1.20",
    "onnxslim>=0.1.34",
    "onnx>=1.12.0,<2.0.0",
    "torch",
    "torchvision",
    "pyqt6>=6.11.0",
    "tensorrt-cu12>=10.0",
    "tensorrt-cu12-bindings>=10.0",
    "tensorrt-cu12-libs>=10.0",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "label-studio>=1.22.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
tensorrt-cu12 = { index = "nvidia" }
tensorrt-cu12-bindings = { index = "nvidia" }
tensorrt-cu12-libs = { index = "nvidia" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

[project.urls]
Repository = "https://github.com/4keles/Solar-Panel-AI-Analysis"
"Model Hub" = "https://huggingface.co/4keles/solar-panel-od"
